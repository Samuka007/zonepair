services:
  b:
    image: ${B_IMAGE:-ghcr.io/samuka007/zonepair-server:latest}
    restart: unless-stopped
    environment:
      TOKEN: ${B_TOKEN:-}
      CLAUDE_CMD: ${B_CLAUDE_CMD:-}
      CLAUDE_CONFIG_DIR: /data/claude
    ports:
      - "${B_PUBLISH:-127.0.0.1:7789:7789}"
    volumes:
      - stub-data:/data
      - b-home:/root

volumes:
  stub-data:
  b-home:
