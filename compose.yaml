# Local e2e for the docker suites. The images are built by nix, not by docker:
# run `scripts/nix-docker-load.sh` first to load the flake's `docker-server` /
# `docker-client` outputs into the local daemon.
services:
  b:
    image: claude-io-stub-server:latest
    environment:
      CLAUDE_CMD: ${B_CLAUDE_CMD:-}
    ports:
      - "127.0.0.1:7789:7789"
    volumes:
      - stub-data:/data

  a:
    image: claude-io-stub-client:latest
    environment:
      CLAUDE_STUB_ENDPOINT: b:7788
    depends_on:
      - b

volumes:
  stub-data:
