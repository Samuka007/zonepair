[package]
name = "claude-io-stub"
version = "0.1.0"
edition = "2021"
description = "C/S stub pair: relay OpenCode's Claude Agent SDK stdio/control channel to a remote claude binary, plus session-store projection RPC"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[[bin]]
name = "stub-server"
path = "src/bin/stub-server.rs"

[[bin]]
name = "stub-client"
path = "src/bin/stub-client.rs"

[[bin]]
name = "claude-mock"
path = "src/bin/claude-mock.rs"

[[bin]]
name = "zonepair-e2e"
path = "src/bin/zonepair-e2e.rs"

[profile.release]
strip = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
