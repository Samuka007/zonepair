[workspace]
resolver = "2"
members = [
    "crates/zonepair-proto",
    "crates/zonepair-server",
    "crates/zonepair-client",
    "crates/zonepair-e2e",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "net", "io-util", "io-std",
    "process", "sync", "time",
] }
sha2 = "0.10"
base64 = "0.22"
zonepair-proto = { path = "crates/zonepair-proto" }
zonepair-client = { path = "crates/zonepair-client" }

[workspace.package]
edition = "2021"
version = "0.1.0"

# Virtual-workspace root profiles apply to the whole workspace.
[profile.release]
strip = true
