[package]
name = "claude-io-stub"
version = "0.1.0"
edition = "2021"
description = "C/S stub pair: relay OpenCode's Claude Agent SDK stdio/control channel to a remote claude binary, plus session-store projection RPC"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal"] }
tokio-tungstenite = "0.23"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "stub-server"
path = "src/bin/stub-server.rs"

[[bin]]
name = "stub-client"
path = "src/bin/stub-client.rs"

[profile.release]
strip = true
