name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Builds checks.default (the crate with `cargo test` in checkPhase) plus
      # the shellcheck check, and evaluates every package/devShell.
      - run: nix flake check -L

  e2e-native:
    name: e2e (native, mock claude)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c cargo test --workspace

  e2e-docker:
    name: e2e (docker, nix-built images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Builds docker-server/docker-client via dockerTools, loads them into the
      # runner's docker daemon, then boots the two-container suite.
      - run: scripts/run-e2e-docker.sh
