name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Builds checks.default (the crate with `cargo test` in checkPhase) plus
      # the shellcheck check, and evaluates every package/devShell. On darwin
      # this exercises the stub-darwin build path and the suite's non-procfs
      # branches; the no-dial attribution is linux-only by design.
      - run: nix flake check -L

  e2e-native:
    name: e2e (native, mock claude)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c cargo test --workspace

  e2e-docker:
    name: e2e (docker, nix-built images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Builds docker-server/docker-client via dockerTools, loads them into the
      # runner's docker daemon, then boots the two-container suite.
      - run: scripts/run-e2e-docker.sh
