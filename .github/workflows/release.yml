name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # upload release assets
  packages: write # push images to ghcr.io

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: samuka007
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - run: nix flake check -L

  # The flake stages the published asset names; the workflow only moves files
  # out of the store. Linux stays static musl, macOS dynamic — that decision
  # lives in the flake, not here.
  release-binaries:
    name: release binaries (${{ matrix.system }})
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: samuka007
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - run: nix build -L .#release-dist --out-link release-dist
      # Nothing else builds packages.stub-client / packages.stub-server on
      # darwin: CI's flake check builds checks.default (= `stub`), and
      # release-dist builds `stub-darwin`, a distinct derivation from per-bin
      # `stub-server` now that mkStub honors `bins`. Without this, tagged
      # `#stub-client` / `#stub-server` installs 404 on cachix and consumers
      # fall back to a full fenix toolchain download + local build (#13).
      # No --out-link here: the release-dist out-link from the previous step
      # must survive for the cp below. Linux stub-client is already pushed by
      # the docker-images job.
      - run: nix build -L .#stub-client .#stub-server
        if: matrix.system == 'aarch64-darwin'
      - run: cp -rL release-dist/dist dist # deref the store symlink for upload
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.system }}
          path: dist/*
          if-no-files-found: error

  windows-client:
    name: client .exe (x86_64-windows)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: samuka007
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - run: nix build -L .#release-dist-windows --out-link release-dist
      - run: cp -rL release-dist/dist dist # deref the store symlink for upload
      - uses: actions/upload-artifact@v7
        with:
          name: windows-client
          path: dist/*
          if-no-files-found: error

  # One job per native arch builds and pushes BOTH images (the flake app owns
  # naming and tools); the publish job merges the per-arch tags into the
  # multi-arch indexes. Registry-protocol level throughout: no docker daemon,
  # no load hop, layer digests never change.
  docker-images:
    name: images (${{ matrix.system }})
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    env:
      OWNER: ${{ github.repository_owner }}
      PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: samuka007
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - run: nix run -L .#push-image -- "${{ matrix.system }}"

  publish-images:
    name: merge multi-arch index -> ghcr.io
    needs: [docker-images]
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix run -L .#merge-images -- "$GITHUB_REF_NAME"

  release:
    name: publish GitHub release
    needs: [release-binaries, windows-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
