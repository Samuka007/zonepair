[package]
name = "zonepair-client"
version.workspace = true
edition.workspace = true
description = "Machine A: ws-line-v1 transport, store RPC client, mirror sync and the stub-client CLI"

[dependencies]
zonepair-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2.workspace = true
base64.workspace = true
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
dirs = "7"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
webpki-roots = "0.26"
clap = { version = "4.6.8", features = ["derive"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
